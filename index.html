  const res=await safeCloudFetch(CLOUD_CONFIG.url+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:CLOUD_CONFIG.publishableKey,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:cloudSession.refresh_token})});

 }
 const response=await safeCloudFetch(CLOUD_CONFIG.url+path,{...options,headers:{apikey:CLOUD_CONFIG.publishableKey,'Content-Type':'application/json',...(authenticated?{Authorization:'Bearer '+cloudSession.access_token}:{}),...options.headers}});
 const body=await response.json().catch(()=>null);
 if(authenticated&&requestEpoch!==authEpoch)throw Error('계정이 변경되어 요청을 중단했어요.');
 if(!response.ok){if(body?.code==='40001'){cloudConflict=true;throw Error('다른 기기의 기록이 바뀌었어요. 사용할 기록을 선택해 주세요.')}

   cloudStatus='최신 온라인 기록을 확인했어요.';
  }
 }catch(e){if(epoch===authEpoch)cloudStatus=e.message;throw e}finally{cloudBusy=false;if(epoch===authEpoch){refreshCloudUI();if(cloudMeta().dirty&&!cloudConflict&&JSON.stringify(state)!==snapshot)queueCloudSave()}}
}
async function cloudLogin(email,token){
 const epoch=authEpoch;
 if(!token){await cloudFetch('/auth/v1/otp',{method:'POST',body:JSON.stringify({email,create_user:true})},false);cloudStatus='이메일로 보낸 인증번호를 입력해 주세요.';return}
 const session=await cloudFetch('/auth/v1/verify',{method:'POST',body:JSON.stringify({email,token,type:'email'})},false);
 if(epoch!==authEpoch)return;authEpoch++;rememberSession(session);activeStorageKey=KEY+'-user-'+session.user.id;state=loadState();cloudConflict=false;cloudStatus='로그인했어요. 온라인 기록을 확인합니다.';stopActivities();quiz=null;await syncCloud();
}
async function resolveCloudConflict(useLocal){
 if(!cloudSession||cloudBusy)return;const epoch=authEpoch;
 if(!confirm(useLocal?'이 기기의 계정 기록으로 온라인 기록을 바꿀까요? 다른 기기의 변경 내용이 대체될 수 있어요.':'온라인 기록으로 이 기기의 계정 기록을 바꿀까요? 아직 저장되지 않은 변경 내용이 대체될 수 있어요.'))return;
 const rows=await cloudFetch('/rest/v1/user_learning_state?select=state,revision&user_id=eq.'+cloudSession.user.id);if(epoch!==authEpoch)return;
 const revision=rows[0]?.revision||0;
 if(!useLocal){state=normalizeState(rows[0]?.state||defaultState());localStorage.setItem(activeStorageKey,JSON.stringify(state))}
 storeCloudMeta({revision,dirty:useLocal});cloudConflict=false;cloudStatus='사용할 기록을 선택했어요.';await syncCloud();
}
function accountHTML(){
 const enabled=!!(CLOUD_CONFIG.enabled&&CLOUD_CONFIG.url&&CLOUD_CONFIG.publishableKey);
 if(!enabled)return `<div class="panel pad"><span class="eyebrow">MY ACCOUNT<\/span><h1 class="h1">나의 학습 계정<\/h1><p class="lead">기기 간에 기록을 이어 쓸 수 있도록 계정 연결을 준비하고 있어요. 현재는 이 브라우저에 기록됩니다.<\/p><button class="btn primary gap-top" data-act="goto" data-to="settings">학습 기록 백업하기<\/button><\/div>`;
 return `<div class="panel pad"><span class="eyebrow">MY ACCOUNT<\/span><h1 class="h1">${cloudSession?'나의 학습 계정':'이메일로 시작하기'}<\/h1>${cloudSession?`<p class="lead">${esc(cloudSession.user.email||'로그인한 사용자')}<\/p><p>기초 진도·오답·시험 연습 기록을 계정에 저장합니다.<\/p><div class="button-row"><button class="btn primary" data-act="cloud-sync" ${cloudBusy?'disabled':''}>지금 동기화<\/button><button class="btn" data-act="cloud-import">로그인 전 기기 기록 가져오기<\/button><button class="btn" data-act="cloud-logout" ${cloudBusy?'disabled':''}>로그아웃<\/button><\/div>${cloudConflict?`<div class="alert gap-top"><p>여러 기기의 기록이 달라요. 덮어쓰기 전에 설정에서 기록을 백업할 수 있습니다.<\/p><div class="button-row"><button class="btn" data-act="cloud-use-remote">온라인 기록 사용<\/button><button class="btn" data-act="cloud-use-local">이 기기 기록으로 온라인 저장<\/button><\/div><\/div>`:''}`:`<p class="lead">이메일 인증번호로 로그인해요. 처음 사용하면 계정이 함께 만들어집니다.<\/p><form id="cloud-login" class="settings-list gap-top"><label>이메일<input id="cloud-email" class="search" type="email" autocomplete="email" required maxlength="254"><\/label><label>인증번호<input id="cloud-otp" class="search" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6,10}" maxlength="10" placeholder="번호를 받은 뒤 입력"><\/label><div class="button-row"><button class="btn" type="submit" name="mode" value="send">인증번호 받기<\/button><button class="btn primary" type="submit" name="mode" value="verify">인증하고 로그인<\/button><\/div><\/form>`}<p id="cloud-status" class="tip gap-top" role="status">${esc(cloudStatus||(cloudSession?'연결 상태를 확인해 주세요.':'로그인 전 기록은 이 브라우저에 보관됩니다.'))}<\/p><\/div>`;
}
async function handleCloudAction(a){
 try{
  if(a==='cloud-sync')await syncCloud();
  if(a==='cloud-use-remote')await resolveCloudConflict(false);
  if(a==='cloud-use-local')await resolveCloudConflict(true);
  if(a==='cloud-import'&&confirm('로그인 전 이 브라우저의 기록으로 현재 계정 기록을 바꿀까요? 계정의 기존 기록은 설정에서 먼저 백업하세요.')){const raw=localStorage.getItem(KEY);if(!raw)throw Error('가져올 기기 기록이 없어요.');state=normalizeState(JSON.parse(raw));save();await syncCloud()}
  if(a==='cloud-logout'){
   if(cloudMeta().dirty&&!confirm('아직 온라인에 저장되지 않은 기록이 있어요. 설정에서 먼저 백업할 수 있습니다. 이 기기의 계정 기록을 지우고 로그아웃할까요?'))return;
   clearTimeout(cloudTimer);stopActivities();const oldKey=activeStorageKey;authEpoch++;cloudSession=null;cloudConflict=false;localStorage.removeItem('english-cloud-session');localStorage.removeItem(oldKey);localStorage.removeItem(oldKey+'-sync');activeStorageKey=KEY;state=loadState();quiz=null;cloudStatus='로그아웃했어요. 로그인 전 기기 기록으로 돌아왔어요.';
  }
 }catch(e){cloudStatus=e.message}refreshCloudUI();
}
app.addEventListener('submit',async event=>{
 if(event.target.id!=='cloud-login')return;event.preventDefault();
 const email=document.getElementById('cloud-email').value.trim(),token=document.getElementById('cloud-otp').value.trim(),mode=event.submitter?.value;
 if(mode==='verify'&&!/^\d{6,10}$/.test(token)){document.getElementById('cloud-status').textContent='이메일로 받은 인증번호를 입력해 주세요.';return}
 const buttons=[...event.target.querySelectorAll('button')];buttons.forEach(b=>b.disabled=true);
 try{await cloudLogin(email,mode==='verify'?token:'');if(cloudSession)render();else document.getElementById('cloud-status').textContent=cloudStatus}catch(e){cloudStatus=e.message;if(screen==='account'){const n=document.getElementById('cloud-status');if(n)n.textContent=cloudStatus}}
 finally{buttons.forEach(b=>b.disabled=false)}
});
window.addEventListener('online',()=>{if(cloudSession)syncCloud().catch(()=>{})});
window.addEventListener('focus',()=>{if(cloudSession)syncCloud().catch(()=>{})});

render();
if(cloudSession)syncCloud().catch(()=>{});
if('serviceWorker' in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();

</script>
